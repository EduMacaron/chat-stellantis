<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>1r ai — Tela de bloqueio (prévia)</title>
<style>
  :root{
    /* Cole aqui a URL de uma imagem sua/livre para usar como fundo. */
    /* Ex.: --bg-image: url("https://.../sua-imagem.jpg"); */
    --bg-image: none;
    --azul:#00102e;
    --azul-2:#001f52;
    --glow:#1e5bff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    color:#eef1f7;
    background:#000;
    position:relative;
    overflow:hidden;
  }
  /* Camada de imagem de fundo (opcional) */
  .bg{
    position:absolute;inset:0;
    background-image:var(--bg-image);
    background-size:cover;
    background-position:center;
    filter:saturate(1.05);
    z-index:0;
  }
  /* Gradiente escuro por cima, garante contraste com ou sem foto */
  .veu{
    position:absolute;inset:0;
    background:
      radial-gradient(120% 80% at 50% 12%, rgba(0,16,46,.35), rgba(0,0,0,.85) 70%),
      linear-gradient(180deg, #05070d 0%, #070b16 55%, #05070d 100%);
    z-index:1;
  }
  /* Brilho azul suave na base */
  .brilho-base{
    position:absolute;left:50%;bottom:-140px;transform:translateX(-50%);
    width:80vw;max-width:900px;height:300px;
    background:radial-gradient(50% 50% at 50% 50%, rgba(30,91,255,.35), rgba(30,91,255,0) 70%);
    filter:blur(20px);
    z-index:1;
    pointer-events:none;
  }
  .cartao{
    position:relative;z-index:2;
    width:min(92vw,460px);
    text-align:center;
    padding:40px 28px 34px;
    border-radius:26px;
    background:rgba(18,21,29,.55);
    border:1px solid rgba(255,255,255,.08);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    box-shadow:0 20px 60px rgba(0,0,0,.55);
  }
  /* Logo STELLANTIS com luz prateada passando por cima */
  .marca-luz{
    display:block;margin:0 auto 6px;
    width:clamp(220px,64vw,360px);
    aspect-ratio:1180.5 / 250;
    background:linear-gradient(90deg,#5a6172 0%,#5a6172 40%,#eef1f7 50%,#5a6172 60%,#5a6172 100%);
    background-size:300% 100%;
    -webkit-mask:url("stellantis.svg") no-repeat center/contain;
    mask:url("stellantis.svg") no-repeat center/contain;
    filter:drop-shadow(0 3px 8px rgba(0,0,0,.5));
    animation:brilho 3.5s ease-in-out infinite;
  }
  @keyframes brilho{
    0%{background-position:120% 0;}
    100%{background-position:-20% 0;}
  }
  .patrimonial{
    font-family:Georgia,"Times New Roman","Cambria",serif;
    font-size:clamp(13px,4vw,17px);
    font-weight:700;letter-spacing:6px;text-transform:uppercase;
    opacity:.92;margin-top:8px;
  }
  .assinatura{
    margin-top:26px;
    font-size:13px;letter-spacing:.5px;opacity:.65;
  }
  .assinatura b{color:#dfe6ff;font-weight:600;}
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="veu"></div>
  <div class="brilho-base"></div>

  <main class="cartao">
    <span class="marca-luz" role="img" aria-label="STELLANTIS"></span>
    <div class="patrimonial">Patrimonial</div>
    <div class="assinatura">Assistente <b>1r ai</b> — Segurança Patrimonial</div>
  </main>
</body>
</html>
