<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>1r ai — Tela de bloqueio (prévia)</title>
  <style>
    html, body { margin:0; padding:0; height:100%;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      background:#000; color:#eef1f7; }

    /* ====== Tela de bloqueio: imagem em tela cheia + apenas o campo de senha ====== */
    #login-overlay { position:fixed; inset:0; z-index:1000;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      padding:24px; overflow:hidden; background:#000; }
    #login-overlay.hidden { display:none; }

    /* Imagem de fundo em tela cheia */
    #login-overlay .bg { position:absolute; inset:0;
      background-image:url("bd91f442-3e65-431b-afd8-8a5c54731c81.jpg");
      background-size:cover; background-position:center; filter:blur(28px) brightness(.6); transform:scale(1.18); z-index:0; }

    /* Escurecimento sutil so para dar legibilidade ao campo (sem cartao, sem textos) */
    #login-overlay .veu { position:absolute; inset:0; z-index:1;
      background-image:url("bd91f442-3e65-431b-afd8-8a5c54731c81.jpg"); background-size:contain; background-position:center; background-repeat:no-repeat; }

    /* Campo de senha flutuante */
    #login-overlay .form-senha { position:relative; z-index:2;
      width:min(78vw,320px); margin-top:auto; margin-bottom:3vh;
      display:flex; flex-direction:column; gap:12px; }
    #login-overlay .campo { display:flex; align-items:center; gap:10px;
      padding:11px 14px; border-radius:14px;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.38);
      backdrop-filter:blur(18px) saturate(160%); -webkit-backdrop-filter:blur(18px) saturate(160%);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.35),
                 inset 0 0 0 1px rgba(255,255,255,.06),
                 0 10px 34px rgba(0,0,0,.35); }
    #login-overlay .campo input { flex:1; border:none; outline:none;
      background:transparent; color:#fff; font-size:15px; letter-spacing:2px; text-align:center; }
    #login-overlay .campo input::placeholder { color:rgba(255,255,255,.7); letter-spacing:.5px; }
    #login-overlay .btn-entrar { padding:14px 16px; border-radius:16px;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.38); color:#fff;
      font-size:15px; font-weight:600; letter-spacing:1px; cursor:pointer;
      backdrop-filter:blur(18px) saturate(160%); -webkit-backdrop-filter:blur(18px) saturate(160%);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.35),
                 inset 0 0 0 1px rgba(255,255,255,.06),
                 0 10px 34px rgba(0,0,0,.35);
      transition:transform .12s ease, box-shadow .12s ease, background .12s ease; }
    #login-overlay .btn-entrar:hover { transform:translateY(-1px);
      background:rgba(255,255,255,.12);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.45), 0 12px 38px rgba(0,0,0,.4); }
    #login-overlay .btn-entrar:active { transform:translateY(0); }
    #login-overlay .btn-entrar:disabled { opacity:0.6; cursor:default; }
    #login-overlay .aviso { min-height:16px; text-align:center;
      font-size:12px; letter-spacing:.3px; opacity:.95; color:#ffb3b3;
      text-shadow:0 1px 3px rgba(0,0,0,.6); }
  </style>
</head>
<body>
  <div id="login-overlay">
    <div class="bg"></div>
    <div class="veu"></div>

    <form id="login-form" class="form-senha">
      <div class="campo">
        <input type="password" id="senha" placeholder="Digite a senha de acesso" autocomplete="current-password" />
      </div>
      <button type="submit" id="entrar" class="btn-entrar">Entrar</button>
      <div class="aviso" id="login-erro"></div>
    </form>
  </div>

  <script>
    const WEBHOOK = 'https://emacaron.app.n8n.cloud/webhook/add5ef72-1f64-4570-8834-34743a122b82/chat';
    const USUARIO = 'STELLANTIS';
    const overlay = document.getElementById('login-overlay');
    const form = document.getElementById('login-form');
    const inputSenha = document.getElementById('senha');
    const btn = document.getElementById('entrar');
    const erro = document.getElementById('login-erro');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const senha = inputSenha.value;
      if (!senha) { erro.textContent = 'Digite a senha.'; return; }
      const authHeader = 'Basic ' + btoa(USUARIO + ':' + senha);
      btn.disabled = true; erro.textContent = 'Verificando...';
      try {
        const resp = await fetch(WEBHOOK, {
          method: 'POST',
          headers: { Authorization: authHeader, 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'loadPreviousSession', sessionId: 'verificacao-de-acesso' })
        });
        if (resp.status === 401 || resp.status === 403) {
          erro.textContent = 'Senha incorreta.'; btn.disabled = false; return;
        }
        erro.textContent = 'Senha correta! (previa — o chat abriria aqui)';
        btn.disabled = false;
      } catch (err) {
        erro.textContent = 'Erro de conexao. Tente novamente.'; btn.disabled = false;
      }
    });
  </script>
</body>
</html>
